<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Dawid Gębara — Frontend Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#151b28"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.3" fill="#1f2937"/>
  </pattern>
  <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<style>
  .name{font:700 66px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#f0f6fc}
  .hi{font:500 20px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#8b949e}
  .role{font:500 24px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#8b949e;opacity:0}
  .stk{font:500 17px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#8b949e}
  .tag{font:500 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#8b949e}
  .l1,.l2,.l3{transform-box:fill-box}
  .l1{animation:float 5s ease-in-out infinite}
  .l2{animation:float 5s ease-in-out .35s infinite}
  .l3{animation:float 5s ease-in-out .7s infinite}
  .mark{transform-box:fill-box;transform-origin:left center;animation:draw .9s .3s cubic-bezier(.2,.8,.2,1) both}
  .st{animation:rise .6s ease-out both}
  .r0{animation:roles 12s 0s infinite both}.r1{animation:roles 12s 3s infinite both}.r2{animation:roles 12s 6s infinite both}.r3{animation:roles 12s 9s infinite both}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes roles{0%{opacity:0;transform:translateY(8px)}3%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.r0{opacity:1}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)" opacity=".9"/>

  <g class="l3"><polygon points="170,150 250,190 170,230 90,190" fill="#334155" fill-opacity="1"/></g>
  <g class="l2"><polygon points="170,115 250,155 170,195 90,155" fill="#f59e0b" fill-opacity="0.85"/></g>
  <g class="l1"><polygon points="170,80 250,120 170,160 90,120" fill="#facc15" fill-opacity="1"/></g>

  <text class="hi" x="332" y="104">hi there, i'm</text>
  <g transform="skewX(-8)"><rect class="mark" x="345" y="150" width="452" height="26" rx="4" fill="#facc15" fill-opacity="0.30"/></g>
  <text class="name" x="328" y="172" textLength="440" lengthAdjust="spacingAndGlyphs">Dawid Gębara</text>
  <text class="role r0" x="330" y="238"><tspan fill="#facc15">&gt;</tspan> frontend engineer @ sopra steria</text><text class="role r1" x="330" y="238"><tspan fill="#facc15">&gt;</tspan> react · typescript · next.js</text><text class="role r2" x="330" y="238"><tspan fill="#facc15">&gt;</tspan> learning .net → going fullstack</text><text class="role r3" x="330" y="238"><tspan fill="#facc15">&gt;</tspan> websites · seo audits · scraping</text>

  <g class="st" style="animation-delay:0.4s"><line x1="985" y1="217" x2="1015" y2="217" stroke="#30363d" stroke-width="2"/><text x="1027" y="222" class="stk">html</text></g><g class="st" style="animation-delay:0.8500000000000001s"><line x1="985" y1="183" x2="1015" y2="183" stroke="#30363d" stroke-width="2"/><text x="1027" y="188" class="stk">layout</text></g><g class="st" style="animation-delay:1.3s"><line x1="985" y1="149" x2="1015" y2="149" stroke="#30363d" stroke-width="2"/><text x="1027" y="154" class="stk">style</text></g><g class="st" style="animation-delay:1.75s"><line x1="985" y1="115" x2="1015" y2="115" stroke="#30363d" stroke-width="2"/><text x="1027" y="120" class="stk">motion</text></g>
  <text class="tag" x="1165" y="262" text-anchor="end">// built layer by layer</text>
</g>
</svg>
